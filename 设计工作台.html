  <script>location.replace(`index.html${location.search}`);</script>
  <style>
    :root{--ink:#172239;--muted:#718097;--line:#e4eaf1;--page:#f5f7fa;--blue:#246bfe;--soft:#edf4ff;--good:#14865a;--danger:#b4454d}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(36,107,254,.18);outline-offset:1px}.shell{min-height:100vh;display:flex}.side{position:fixed;inset:0 auto 0 0;width:210px;padding:24px 14px;border-right:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;border-bottom:1px solid var(--line);font-size:19px;font-weight:800}.mark{display:grid;width:34px;height:34px;place-items:center;border-radius:8px;background:var(--blue);color:#fff}.nav{display:block;margin-top:18px;padding:11px 12px;border-radius:7px;background:var(--soft);color:var(--blue);font-weight:700;text-decoration:none}main{width:calc(100% - 210px);margin-left:210px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:80px;padding:15px clamp(18px,3vw,42px);border-bottom:1px solid var(--line);background:#fff}.top h1{margin:2px 0 0;font-size:20px}.crumb,.muted{color:var(--muted);font-size:12px}.top-actions,.actions,.inline-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pill{padding:5px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px}.btn{min-height:36px;padding:0 12px;border:1px solid #d6e0eb;border-radius:6px;background:#fff;color:#53627a;font-size:12px;font-weight:700}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.good{border-color:#9ad8ba;background:#f2fbf6;color:#13764d}.btn.danger{border-color:#eac2c4;color:var(--danger)}.btn:disabled{opacity:.5;cursor:not-allowed}.project-bar{display:flex;align-items:center;gap:16px;padding:14px clamp(18px,3vw,42px);border-bottom:1px solid var(--line);background:#fff}.project-name{min-width:180px}.project-name b{display:block}.status{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted);font-size:12px}.status i{width:8px;height:8px;border-radius:50%;background:#95a0ae}.status.ready{color:var(--good)}.status.ready i{background:#19a36a}.workspace{max-width:1440px;margin:auto;padding:22px clamp(16px,3vw,42px) 58px}.main-panel{padding-bottom:24px;border-bottom:1px solid var(--line)}.section-title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:15px}.section-title h2{margin:0;font-size:17px}.section-title p{margin:3px 0 0;color:var(--muted);font-size:12px}.visual-row,.material-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:22px;align-items:start}.visual-row>div:first-child,.material-grid>div:first-child{min-width:0}.art-card{position:relative;display:grid;width:auto;max-width:100%;height:min(720px,calc(100vh - 250px));aspect-ratio:var(--ratio,3 / 4);overflow:hidden;border:1px solid #dce5ef;border-radius:8px;background:var(--canvas-bg,#fff)}.art-card>.base{display:block;width:100%;height:100%;object-fit:contain;background:transparent}.art-empty{display:grid;place-items:center;padding:30px;background:#fbfcfe;color:#8795a8;text-align:center}.art-empty b{display:block;margin-bottom:5px;color:#56687f}.tag{position:absolute;top:10px;left:10px;z-index:5;padding:3px 7px;border-radius:4px;background:rgba(24,37,60,.74);color:#fff;font-size:11px}.badge-overlay{position:absolute;z-index:4;width:15%;height:auto;object-fit:contain;cursor:grab;touch-action:none}.badge-overlay:active{cursor:grabbing}.detail{display:flex;width:100%;max-width:430px;flex-direction:column}.detail-card{margin-bottom:10px;padding:13px;border:1px solid var(--line);border-radius:7px;background:#fff}.detail-card b{display:block;margin-bottom:6px;color:#4e6078;font-size:12px}.detail-card.prompt-card{display:flex;min-height:220px;flex:1;flex-direction:column}.detail-card.prompt-card .field.prompt{flex:1}.field-label{display:block;margin-top:9px;color:#5c6d84;font-size:11px;font-weight:700}.field{display:block;width:100%;min-height:36px;margin-top:5px;padding:8px 9px;border:1px solid #d9e3ed;border-radius:6px;background:#fff;color:#36475f;font-size:12px;resize:vertical}.field.prompt{min-height:155px}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,107,254,.09)}.refs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.ref{position:relative;min-width:0}.ref img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:1px solid #dce5ef;border-radius:5px;background:#f4f7fa}.ref span{display:block;overflow:hidden;margin-top:3px;color:#76869a;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.ref-actions{display:flex;gap:3px;margin-top:3px}.ref-actions button,.ref-actions label{display:grid;min-width:0;flex:1;place-items:center;min-height:22px;margin:0;padding:0 3px;border:1px solid #d4deea;border-radius:4px;background:#fff;color:#617188;font-size:10px;cursor:pointer}.ref-actions .remove-ref{border-color:#edc8ca;color:#ad5055}.ref-actions input{display:none}.versions{display:flex;gap:7px;overflow:auto}.version{position:relative;width:60px;height:70px;flex:0 0 auto;overflow:hidden;padding:0;border:2px solid transparent;border-radius:5px;background:#eff3f7}.version.selected{border-color:var(--blue)}.version img{width:100%;height:100%;object-fit:cover}.version span{position:absolute;right:2px;bottom:2px;padding:1px 3px;background:rgba(24,37,60,.72);color:#fff;font-size:9px}.material-area{padding-top:24px}.material-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}.material-tabs{display:flex;flex:1;gap:7px;overflow:auto}.material-tab{height:35px;flex:0 0 auto;padding:0 11px;border:1px solid #dce4ee;border-radius:6px;background:#fff;color:#5d6d83;font-size:12px;font-weight:700}.material-tab.active{border-color:#a7c6ff;background:var(--soft);color:var(--blue)}.add-material{display:flex;gap:6px}.add-material input{width:120px;height:35px;padding:0 8px;border:1px solid #dce4ee;border-radius:6px}.material-grid .art-card{width:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-grid .wide{grid-column:1/-1}.ratio-status{margin:8px 0 0;color:#718097;font-size:11px}.source-choice{display:grid;gap:6px;padding:8px;border-radius:6px;background:#f5faf7;color:#547263;font-size:11px}.source-choice b{font-size:11px}.source-options{display:flex;flex-wrap:wrap;gap:6px}.source-option{display:flex;align-items:center;gap:4px;max-width:100%;padding:4px 6px;border:1px solid #cee1d6;border-radius:5px;background:#fff;color:#516f61}.source-option input{margin:0}.generating{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(248,251,254,.93);color:#48658d;text-align:center}.spinner{width:30px;height:30px;margin:0 auto 9px;border:3px solid #d7e5ff;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:22px;bottom:22px;z-index:20;max-width:min(420px,calc(100vw - 36px));padding:11px 13px;border:1px solid #c9daf6;border-radius:7px;background:#f5f9ff;color:#315b99;box-shadow:0 10px 25px rgba(41,52,70,.13);opacity:0;pointer-events:none;transform:translateY(7px);transition:.2s}.toast.show{opacity:1;transform:none}.return-edit{position:fixed;bottom:16px;left:226px;z-index:10}.modal-layer{display:none;position:fixed;inset:0;z-index:30;padding:18px;background:rgba(19,31,52,.42)}.modal-layer.show{display:grid;place-items:center}.modal{width:min(620px,100%);max-height:calc(100vh - 36px);overflow:auto;padding:20px;border-radius:9px;background:#fff}.modal-head{display:flex;align-items:start;justify-content:space-between;gap:12px;padding-bottom:13px;border-bottom:1px solid var(--line)}.modal h2{margin:0;font-size:17px}.modal textarea{width:100%;min-height:130px;margin-top:12px;padding:9px;border:1px solid #d9e3ed;border-radius:6px;resize:vertical}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
    @media(max-width:1000px){.side{width:64px;padding:20px 9px}.brand span,.nav span:last-child{display:none}.brand{justify-content:center;padding:0 0 18px}.nav{text-align:center}main{width:calc(100% - 64px);margin-left:64px}.return-edit{left:78px}}@media(max-width:780px){.side{display:none}main{width:100%;margin:0}.top{align-items:start;padding:14px}.project-bar{display:block;padding:12px 14px}.status{margin-top:8px}.workspace{padding:17px 13px 72px}.visual-row,.material-grid{grid-template-columns:1fr}.art-card,.material-grid .art-card{width:100%}.form-grid{grid-template-columns:1fr}.add-material{width:100%;margin-top:8px}.material-toolbar{display:block}.return-edit{left:13px}.pill{display:none}}
  </style>
  <style>
    .detail-card.prompt-card{min-height:0}.prompt-actions{margin:-2px 0 10px}.prompt-viewer{border:1px solid #d9e3ed;border-radius:6px;background:#f8fafc}.prompt-viewer summary{padding:9px 10px;color:#43638b;font-size:12px;font-weight:700;cursor:pointer}.prompt-viewer pre{max-height:260px;overflow:auto;margin:0;padding:0 10px 10px;white-space:pre-wrap;word-break:break-word;color:#36475f;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.skill-content{display:grid;gap:12px;margin-top:14px}.skill-rule{padding:12px;border:1px solid #d9e3ed;border-radius:6px;background:#f8fafc}.skill-rule h3{margin:0 0 4px;font-size:13px}.skill-rule p{margin:0 0 9px;color:#718097;font-size:12px}.skill-rule pre{max-height:360px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0;color:#36475f;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}

<body>
  <div class="shell"><aside class="side"><div class="brand"><div class="mark">Y</div><span>易画</span></div><a class="nav" id="entryLink" href="index.html"><span>▣</span><span>设计信息</span></a></aside>
  <main><header class="top"><div><div class="crumb">设计工作台</div><h1 id="pageTitle">设计工作台</h1></div><div class="top-actions"><span class="pill" id="projectId">读取中</span><button class="btn" id="skillButton" type="button">查看内置 Skill</button><button class="btn" id="publishPresetButton" type="button" disabled>完成项目并发布为预设</button><button class="btn good" id="exportButton" type="button">打印提案</button></div></header>
  <section class="project-bar"><div class="project-name"><b id="taskName">未选择项目</b><span class="muted" id="taskRatio">-</span></div><div class="muted" id="taskNote">正在读取设计信息。</div><div class="status" id="projectStatus"><i></i><span>正在连接服务</span></div></section>
  <div class="workspace"><section class="main-panel"><div class="section-title"><div><h2>01 礼盒主视觉</h2><p>模型生成完整画面与已确认文字，徽章由系统按需求位置后置叠加。</p></div><span class="muted" id="resultCount"></span></div><div id="mainContent"></div></section>
  <section class="material-area"><div class="section-title"><div><h2>02 物料与延展</h2><p>每种物料独立保存文字、画幅、参考图和徽章位置。</p></div></div><div class="material-toolbar"><div class="material-tabs" id="materialTabs"></div><div class="add-material"><input id="newMaterialName" placeholder="新增物料名称"/><button class="btn" id="addMaterialButton" type="button">新增</button></div></div><div id="materialContent"></div></section></div></main></div>
  <button class="btn return-edit" id="returnEditButton" type="button">返回修改设计信息</button><div class="toast" id="toast"></div>
  <div class="modal-layer" id="feedbackModal"><section class="modal"><div class="modal-head"><div><h2>添加修改</h2><p class="muted" id="feedbackTarget"></p></div><button class="btn" data-close="feedbackModal" type="button">关闭</button></div><textarea id="feedbackInput" placeholder="例如：保留构图和文字区，减少装饰，强化蓝黄色对比。"></textarea><div class="modal-footer"><button class="btn" data-close="feedbackModal" type="button">取消</button><button class="btn primary" id="feedbackButton" type="button">生成修改版 Prompt</button></div></section></div>
  <div class="modal-layer" id="publishPresetModal"><section class="modal"><div class="modal-head"><div><h2>发布为项目预设</h2><p class="muted">仅保存视觉配置、画幅、构图位置与物料设置，不保存正式文案和上传素材。</p></div><button class="btn" data-close="publishPresetModal" type="button">关闭</button></div><label class="field-label">预设名称<input class="field" id="presetPublishName" maxlength="60" placeholder="例如：英语速通课 · 明亮成长礼盒" /></label><div class="source-choice"><b>案例头图（已确认视觉）</b><div class="source-options" id="presetVisualChoices"></div></div><div class="modal-footer"><button class="btn" data-close="publishPresetModal" type="button">取消</button><button class="btn primary" id="presetPublishConfirm" type="button">发布预设</button></div></section></div>
  <div class="modal-layer" id="skillModal"><section class="modal"><div class="modal-head"><div><h2>内置 Prompt Skill</h2><p class="muted">只读展示当前服务端实际调用的规则。正式项目文案与字段配置会在调用时注入这些规则。</p></div><button class="btn" data-close="skillModal" type="button">关闭</button></div><div id="skillContent" class="skill-content">正在读取规则...</div><div class="modal-footer"><button class="btn" data-close="skillModal" type="button">关闭</button></div></section></div>
  <script src="/shared.js"></script>
<script>
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const projectId=new URLSearchParams(location.search).get('projectId');
    const printCanvasSpecs=window.YIHUA.printCanvasSpecs;
    const standardRatios=window.YIHUA.ratioKeys;
    
    const toCanvasSpec=window.YIHUA.toCanvasSpec;
    const modelSizeFor=window.YIHUA.modelSizeFor;
    const defaultMaterials=['主书','练习册','课程单页','社群海报','直播间封面','活动海报'];
    const app={state:null,activeMaterial:null,selections:{},prompts:{},generating:new Set(),polls:new Map(),saveTimer:null,feedbackMaterial:null};
    const toast=m=>{const box=$('#toast');box.textContent=m;box.classList.add('show');setTimeout(()=>box.classList.remove('show'),3600)};
    const escapeHtml=window.YIHUA.escapeHtml;
    const api=async(path,options={})=>{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),90000);try{const res=await fetch(path,{...options,signal:controller.signal}),data=await res.json();if(!res.ok)throw new Error(data.error||'请求失败');return data}catch(error){if(controller.signal.aborted)throw new Error('请求超过 90 秒未完成，请稍后重试。');throw error}finally{clearTimeout(timeout)}};
    const d=()=>app.state?.demand?.payload||{};
    new MutationObserver(()=>{const button=$('#publishPresetButton');if(button)button.disabled=!mainConfirmed()}).observe($('#mainContent'),{childList:true,subtree:true});
    document.addEventListener('click',async event=>{if(event.target.id==='publishPresetButton'){const visuals=allVisuals().filter(v=>v.isConfirmed),main=mainConfirmed();$('#presetPublishName').value=`${d().name||'未命名项目'}视觉预设`;$('#presetVisualChoices').innerHTML=visuals.map(v=>`<label class="source-option"><input type="radio" name="presetVisual" value="${v.id}" ${v.id===main?.id?'checked':''}/><span>${escapeHtml(displayNameFor(v.materialType))} · 已确认版</span></label>`).join('');$('#publishPresetModal').classList.add('show')}if(event.target.id==='presetPublishConfirm'){const name=$('#presetPublishName').value.trim(),visualId=$('[name="presetVisual"]:checked')?.value;if(!name)return toast('请填写预设名称。');try{event.target.disabled=true;await api(`/api/projects/${encodeURIComponent(projectId)}/presets`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,visualId})});$('#publishPresetModal').classList.remove('show');await load();toast('项目已完成并发布为预设。')}catch(error){toast(error.message)}finally{event.target.disabled=false}}});
    document.addEventListener('change',event=>{const input=event.target;if(!input?.dataset?.brief||!app.activeMaterial)return;const brief=briefFor(app.activeMaterial);if(!brief)return;if(input.dataset.brief==='ratio'&&input.value!=='custom'){brief.payload.canvasSpec=toCanvasSpec(input.value);brief.payload.ratio=input.value;saveBrief();render()}if(input.dataset.brief==='customCanvas'){const match=input.value.trim().match(/^(\d+)\s*:\s*(\d+)$/);if(!match)return toast('请输入例如 5:7 的宽高比例。');const spec=toCanvasSpec({ratio:`${match[1]}:${match[2]}`});if(spec.widthUnits>20||spec.heightUnits>20)return toast('宽高均不能超过 20。');brief.payload.canvasSpec=spec;brief.payload.ratio=spec.ratio;saveBrief();render()}});
    document.addEventListener('click',async event=>{if(event.target.id!=='presetPublishConfirm')return;event.stopImmediatePropagation();const name=$('#presetPublishName').value.trim(),visualId=$('[name="presetVisual"]:checked')?.value;if(!name)return toast('请填写预设名称。');try{event.target.disabled=true;const material=allVisuals().find(v=>v.id===visualId)?.materialType||'主视觉';await api(`/api/projects/${encodeURIComponent(projectId)}/presets`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,visualId,coverDataUrl:await compositeDataUrl(material)})});$('#publishPresetModal').classList.remove('show');await load();toast('项目已完成并发布为预设。')}catch(error){toast(error.message)}finally{event.target.disabled=false}},true);
    const allVisuals=()=>app.state?.visuals||[];
    const visualsFor=material=>allVisuals().filter(v=>v.materialType===material).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    const selected=material=>allVisuals().find(v=>v.id===app.selections[material])||visualsFor(material)[0]||null;
    const confirmed=material=>allVisuals().find(v=>v.materialType===material&&v.isConfirmed);
    const mainConfirmed=()=>confirmed('主视觉');
    const briefs=()=>app.state?.materialBriefs||[];
    const briefFor=material=>briefs().find(b=>b.materialType===material)||null;
    const assets=()=>app.state?.assets||[];
    const badges=()=>assets().filter(a=>a.role==='徽章').slice(0,2);
    const promptFor=material=>app.prompts[material]||(()=>{const v=selected(material);return v?app.state.prompts?.find(p=>p.id===v.promptId):app.state.prompts?.find(p=>p.materialType===material)})()||null;
    const positions=()=>d().visualConfig?.textRenderConfig?.previewPositions||{};
    const point=(id,fallback)=>positions()[id]||fallback;
    const canvasFor=material=>toCanvasSpec(material==='主视觉'?(d().canvasSpec||d().ratio||'3:4'):(briefFor(material)?.payload?.canvasSpec||briefFor(material)?.payload?.ratio||d().canvasSpec||d().ratio||'3:4'));
    const ratioFor=material=>canvasFor(material).ratio;
    const canvasBackgroundFor=material=>'#ffffff';
    const copyFor=material=>{if(material==='主视觉'){const facts=d().projectFacts||{};return{title:d().title||facts.headline||'',subtitle:d().subtitle||facts.subtitle||'',level:facts.levelLabel||'',selling:Array.isArray(facts.sellingPoints)?facts.sellingPoints.map(x=>x.text||x).filter(Boolean):String(d().selling||'').split(/\n+/).filter(Boolean)}}const p=briefFor(material)?.payload||{};return{title:p.title||'',subtitle:p.subtitle||'',level:p.grade||p.extraInfo||'',selling:String(p.selling||'').split(/\n+/).filter(Boolean)}};
    const badgePoints=material=>{const corners={'左上角':{left:6,top:6},'右上角':{left:76,top:6},'左下角':{left:6,top:76},'右下角':{left:76,top:76}};const payload=briefFor(material)?.payload||{},saved=payload.badgePositions||{};const pos=material==='主视觉'?[point('previewBadge',{left:76,top:6}),point('previewBadgeTwo',{left:6,top:76})]:[saved.one||corners[payload.badgePosition||'右上角'],saved.two||point('previewBadgeTwo',{left:6,top:76})];return badges().map((asset,index)=>({asset,key:index?'two':'one',...(pos[index]||{left:6,top:6})}));};
    const textLayer=material=>{const copy=copyFor(material),title=point('previewTitle',{left:12,top:13}),sub=point('previewSub',{left:13,top:46}),selling=point('previewSelling',{left:13,top:69});return `${copy.title?`<strong class="canvas-copy title" style="left:${title.left}%;top:${title.top}%">${escapeHtml(copy.title)}</strong>`:''}${copy.subtitle||copy.level?`<span class="canvas-copy subtitle" style="left:${sub.left}%;top:${sub.top}%">${escapeHtml([copy.subtitle,copy.level].filter(Boolean).join(' · '))}</span>`:''}${copy.selling.length?`<span class="canvas-copy selling" style="left:${selling.left}%;top:${selling.top}%">${escapeHtml(copy.selling.join('\n'))}</span>`:''}`};
    const card=material=>{const ratio=ratioFor(material),visual=selected(material),busy=app.generating.has(material),marks=badgePoints(material);return `<div class="art-card" data-art-card style="--ratio:${ratio.replace(':',' / ')};--canvas-bg:${canvasBackgroundFor(material)}">${visual?`<img class="base" data-art-image src="${visual.imageUrl}" alt="${escapeHtml(material)}"/><span class="tag">${visual.isConfirmed?'已确认':visual.status}</span>`:`<div class="art-empty"><div><b>尚未生成${escapeHtml(material)}</b><span>确认 Prompt 后生成视觉底图。</span></div></div>`}${marks.map(m=>`<img class="badge-overlay" data-drag-badge data-material="${escapeHtml(material)}" data-badge-key="${m.key}" style="left:${m.left}%;top:${m.top}%" src="${m.asset.url}" alt="可拖动徽章"/>`).join('')}${busy?`<div class="generating"><div><div class="spinner"></div><b>正在生成${escapeHtml(material)}</b><div class="muted">引用图与画幅设置已锁定</div></div></div>`:''}</div>`};
    const refs=()=>{const preview=assets().find(asset=>asset.role==='画幅预览');return preview?`<div class="ref"><img src="${preview.url}" alt="需求画幅预览"/><span>需求画幅预览</span></div>`:'<span class="muted">提交需求后会显示画幅预览。</span>'};

    (()=>{
      const modal=document.getElementById('skillModal');
      const content=document.getElementById('skillContent');
      const close=()=>modal.classList.remove('show');
      const render=skills=>{
        content.replaceChildren(...skills.map(skill=>{
          const section=document.createElement('section');section.className='skill-rule';
          const title=document.createElement('h3');title.textContent=skill.name;
          const description=document.createElement('p');description.textContent=skill.description;
          const rule=document.createElement('pre');rule.textContent=skill.content;
          section.append(title,description,rule);return section;
        }));
      };
      document.getElementById('skillButton').addEventListener('click',async()=>{
        modal.classList.add('show');content.textContent='正在读取当前服务端规则...';
        try{const response=await fetch('/api/skills/prompt');const data=await response.json();if(!response.ok)throw new Error(data.error||'读取失败');render(data.skills||[])}catch(error){content.textContent=error.message||'无法读取内置 Skill。'}
      });
      modal.addEventListener('click',event=>{if(event.target===modal||event.target.closest('[data-close="skillModal"]'))close()});
    })();
  </script>
</body>
</html>
